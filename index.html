
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tic Tac Toe – Q-Learning AI</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
      text-align: center;
      padding: 40px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1 {
      margin-bottom: 10px;
    }

    select, button {
      font-size: 1rem;
      padding: 8px 16px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 10px;
      justify-content: center;
      margin: 30px auto;
    }

    .cell {
      width: 100px;
      height: 100px;
      font-size: 2.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .cell:hover {
      background-color: #f1f1f1;
    }

    .cell.taken {
      cursor: default;
      background-color: #d9d9d9;
    }

    #status {
      font-size: 1.2rem;
      margin-top: 20px;
      font-weight: 500;
    }

    .controls {
      margin-top: 10px;
    }

    body.dark {
      background-color: #121212;
      color: #f8f9fa;
    }

    body.dark .cell {
      background-color: #1e1e1e;
      color: #ffffff;
    }

    body.dark .cell:hover {
      background-color: #333;
    }

    body.dark .cell.taken {
      background-color: #555;
    }

    body.dark select,
    body.dark button {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
    }
  </style>
</head>

<body>
  <h1>Tic Tac Toe – Q-Learning AI</h1>

  <div class="controls">
    <label for="difficulty">Select Difficulty:</label>

    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>

    <button onclick="resetGame()">Reset</button>
    <button onclick="toggleTheme()">🌓 Toggle Theme</button>
  </div>

  <div class="board" id="board"></div>
  <p id="status"></p>

  <script>
    const EMPTY = " ";
    const PLAYER = "X";
    const AI = "O";

    const WIN_COMBOS = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    let board = Array(9).fill(EMPTY);
    let gameOver = false;
    let qTable = {};
    let aiThinking = false;
    let aiTimeout = null;

    // Load Q-table safely
    fetch("q_table.json")
      .then(response => {
        if (!response.ok) {
          throw new Error("Q-table could not be loaded");
        }
        return response.json();
      })
      .then(data => {
        qTable = data;
        initBoard();
        document.getElementById("status").textContent =
          "Your turn! (X)";
      })
      .catch(error => {
        console.error(error);
        qTable = {};
        initBoard();
        document.getElementById("status").textContent =
          "Q-table unavailable. AI will use fallback moves.";
      });

    // Initialize board
    function initBoard() {
      const boardDiv = document.getElementById("board");
      boardDiv.innerHTML = "";

      board.forEach((cell, idx) => {
        const cellDiv = document.createElement("div");

        cellDiv.className = "cell";
        cellDiv.textContent = cell;

        cellDiv.addEventListener("click", () => playerMove(idx));

        boardDiv.appendChild(cellDiv);
      });
    }

    // Player move
    function playerMove(idx) {
      if (
        board[idx] !== EMPTY ||
        gameOver ||
        aiThinking
      ) {
        return;
      }

      board[idx] = PLAYER;
      updateBoard();

      if (checkWinner(PLAYER)) {
        return endGame("You win!");
      }

      if (isDraw()) {
        return endGame("It's a draw.");
      }

      document.getElementById("status").textContent =
        "AI is thinking...";

      aiThinking = true;

      aiTimeout = setTimeout(() => {
        aiMove();
      }, 200);
    }

    // AI move
    function aiMove() {
      aiTimeout = null;

      if (gameOver) {
        aiThinking = false;
        return;
      }

      const state = board.join("");

      const available = getAvailableMoves();

      if (available.length === 0) {
        aiThinking = false;
        return endGame("It's a draw.");
      }

      let move;
      const difficulty =
        document.getElementById("difficulty").value;

      if (difficulty === "easy") {
        move = randomMove(available);
      }

      else if (difficulty === "medium") {
        move = chooseMediumMove(state, available, qTable);
      }

      else {
        move = chooseHardMove(state, available, qTable);
      }

      // Safety fallback
      if (
        move === undefined ||
        move === null ||
        !available.includes(move)
      ) {
        move = randomMove(available);
      }

      board[move] = AI;

      updateBoard();

      aiThinking = false;

      if (checkWinner(AI)) {
        return endGame("AI wins! 🤖");
      }

      if (isDraw()) {
        return endGame("It's a draw.");
      }

      document.getElementById("status").textContent =
        "Your turn! (X)";
    }

    // Available empty cells
    function getAvailableMoves() {
      return board
        .map((cell, index) =>
          cell === EMPTY ? index : null
        )
        .filter(index => index !== null);
    }

    // Random move
    function randomMove(available) {
      return available[
        Math.floor(Math.random() * available.length)
      ];
    }

    // Find immediate winning or blocking move
    function findWinningMove(player, available) {
      for (const move of available) {
        const testBoard = [...board];

        testBoard[move] = player;

        if (checkWinnerOnBoard(testBoard, player)) {
          return move;
        }
      }

      return null;
    }

    // Medium difficulty
    function chooseMediumMove(state, available, qTable) {

      // 1. Take a winning move
      const winningMove =
        findWinningMove(AI, available);

      if (winningMove !== null) {
        return winningMove;
      }

      // 2. Block player's winning move
      const blockingMove =
        findWinningMove(PLAYER, available);

      if (blockingMove !== null) {
        return blockingMove;
      }

      // 3. Use Q-learning with some randomness
      if (
        Math.random() < 0.3 ||
        !qTable[state]
      ) {
        return randomMove(available);
      }

      // 4. Select best Q-value
      let bestMove = available[0];
      let maxQ = -Infinity;

      for (const move of available) {
        const q = qTable[state][move] ?? 0;

        if (q > maxQ) {
          maxQ = q;
          bestMove = move;
        }
      }

      return bestMove;
    }

    // Hard difficulty
    function chooseHardMove(state, available, qTable) {

      // 1. Take a winning move
      const winningMove =
        findWinningMove(AI, available);

      if (winningMove !== null) {
        return winningMove;
      }

      // 2. Block player's winning move
      const blockingMove =
        findWinningMove(PLAYER, available);

      if (blockingMove !== null) {
        return blockingMove;
      }

      // 3. Use trained Q-table
      if (!qTable[state]) {
        return randomMove(available);
      }

      // 4. Choose best Q-value among legal moves
      let bestMove = available[0];
      let maxQ = -Infinity;

      for (const move of available) {
        const q = qTable[state][move] ?? 0;

        if (q > maxQ) {
          maxQ = q;
          bestMove = move;
        }
      }

      return bestMove;
    }

    // Update board UI
    function updateBoard() {
      const cells =
        document.querySelectorAll(".cell");

      board.forEach((cell, index) => {
        cells[index].textContent = cell;

        cells[index].classList.toggle(
          "taken",
          cell !== EMPTY
        );
      });
    }

    // Check winner using current board
    function checkWinner(player) {
      return checkWinnerOnBoard(board, player);
    }

    // Check winner on any board
    function checkWinnerOnBoard(boardState, player) {
      return WIN_COMBOS.some(combo =>
        combo.every(index =>
          boardState[index] === player
        )
      );
    }

    // Check draw
    function isDraw() {
      return board.every(cell => cell !== EMPTY);
    }

    // End game
    function endGame(message) {
      gameOver = true;
      aiThinking = false;

      if (aiTimeout !== null) {
        clearTimeout(aiTimeout);
        aiTimeout = null;
      }

      document.getElementById("status").textContent =
        message;
    }

    // Reset game
    function resetGame() {
      if (aiTimeout !== null) {
        clearTimeout(aiTimeout);
        aiTimeout = null;
      }

      board = Array(9).fill(EMPTY);
      gameOver = false;
      aiThinking = false;

      document.getElementById("status").textContent =
        "Your turn! (X)";

      initBoard();
    }

    // Toggle dark mode
    function toggleTheme() {
      document.body.classList.toggle("dark");
    }
  </script>
</body>
</html>
